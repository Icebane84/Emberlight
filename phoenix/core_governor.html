<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Phoenix Sovereign Governance HUD v7.0.0</title>
	<meta name="description"
		content="Proposal-gated governor pipeline with real-time receipt ledger, OPFS journal, and AI repair loop.">
	<style>
		/* ── Design tokens ───────────────────────────────────────────────── */
		:root {
			--bg-base: #060b0f;
			--bg-surface: #0d1117;
			--bg-panel: #111820;
			--bg-input: #0a1018;
			--border: #1c2b38;
			--border-accent: #00ffcc33;
			--accent: #00ffcc;
			--accent-dim: #00ccaa;
			--accent-muted: #00ffcc22;
			--warn: #ff9500;
			--danger: #ff3c5a;
			--success: #00ffcc;
			--text-primary: #c8dde8;
			--text-dim: #4a6070;
			--text-accent: #00ffcc;
			--font: 'Courier New', 'Lucida Console', monospace;
			--radius: 4px;
			--glow: 0 0 12px #00ffcc44;
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			height: 100%;
			background: var(--bg-base);
			color: var(--text-primary);
			font-family: var(--font);
			font-size: 12px;
			overflow: hidden;
		}

		/* ── Layout ────────────────────────────────────────────────────── */
		#app {
			display: grid;
			grid-template-rows: 48px 1fr 220px;
			grid-template-columns: 1fr 340px;
			grid-template-areas:
				"header  header"
				"editor  ledger"
				"stats   ledger";
			height: 100vh;
			gap: 1px;
			background: var(--border);
		}

		/* ── Header bar ─────────────────────────────────────────────── */
		#header {
			grid-area: header;
			background: var(--bg-surface);
			display: flex;
			align-items: center;
			padding: 0 16px;
			gap: 12px;
			border-bottom: 1px solid var(--border);
		}

		#header h1 {
			font-size: 13px;
			letter-spacing: 0.12em;
			color: var(--accent);
			flex: 1;
		}

		#header-status {
			font-size: 10px;
			color: var(--text-dim);
			padding: 4px 8px;
			border: 1px solid var(--border);
			border-radius: var(--radius);
			min-width: 100px;
			text-align: center;
			transition: border-color 0.2s, color 0.2s;
		}

		#header-status.pass {
			border-color: var(--success);
			color: var(--success);
		}

		#header-status.reject {
			border-color: var(--danger);
			color: var(--danger);
		}

		#header-status.error {
			border-color: var(--warn);
			color: var(--warn);
		}

		#ai-status {
			font-size: 10px;
			padding: 3px 8px;
			border: 1px solid var(--border);
			border-radius: var(--radius);
			letter-spacing: 0.08em;
			color: var(--text-dim);
			background: var(--bg-surface);
			cursor: pointer;
			transition: border-color 0.2s, color 0.2s;
		}

		#ai-status:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		#ai-status.active {
			border-color: var(--success);
			color: var(--success);
		}

		#ai-status.offline {
			border-color: var(--warn);
			color: var(--warn);
		}

		#ai-status.error {
			border-color: var(--danger);
			color: var(--danger);
		}

		/* ── Proposal Editor ────────────────────────────────────────── */
		#editor-panel {
			grid-area: editor;
			background: var(--bg-surface);
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.panel-title {
			padding: 8px 12px;
			font-size: 10px;
			letter-spacing: 0.1em;
			color: var(--text-dim);
			border-bottom: 1px solid var(--border);
			background: var(--bg-panel);
			text-transform: uppercase;
		}

		#proposal-editor {
			flex: 1;
			background: var(--bg-input);
			color: var(--accent-dim);
			border: none;
			resize: none;
			padding: 12px;
			font-family: var(--font);
			font-size: 11px;
			line-height: 1.6;
			outline: none;
			caret-color: var(--accent);
		}

		#proposal-editor::placeholder {
			color: var(--text-dim);
		}

		#editor-toolbar {
			display: flex;
			gap: 8px;
			padding: 8px 12px;
			background: var(--bg-panel);
			border-top: 1px solid var(--border);
		}

		button {
			background: transparent;
			border: 1px solid var(--border);
			color: var(--text-primary);
			padding: 5px 14px;
			font-family: var(--font);
			font-size: 11px;
			cursor: pointer;
			border-radius: var(--radius);
			letter-spacing: 0.06em;
			transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
		}

		button:hover {
			border-color: var(--accent);
			color: var(--accent);
			box-shadow: var(--glow);
		}

		button:active {
			opacity: 0.75;
		}

		button.primary {
			background: var(--accent-muted);
			border-color: var(--accent);
			color: var(--accent);
		}

		button.primary:hover {
			box-shadow: var(--glow);
		}

		button:disabled {
			opacity: 0.35;
			cursor: not-allowed;
		}

		/* ── Receipt Ledger ──────────────────────────────────────────── */
		#ledger-panel {
			grid-area: ledger;
			background: var(--bg-surface);
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		#ledger-scroll {
			flex: 1;
			overflow-y: auto;
			padding: 6px;
		}

		#ledger-scroll::-webkit-scrollbar {
			width: 4px;
		}

		#ledger-scroll::-webkit-scrollbar-track {
			background: var(--bg-base);
		}

		#ledger-scroll::-webkit-scrollbar-thumb {
			background: var(--border);
			border-radius: 2px;
		}

		.receipt-card {
			border: 1px solid var(--border);
			border-radius: var(--radius);
			margin-bottom: 6px;
			overflow: hidden;
			animation: slideIn 0.2s ease-out;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(-4px);
			}

			to {
				opacity: 1;
				transform: none;
			}
		}

		.receipt-card.pass {
			border-color: #00ffcc44;
		}

		.receipt-card.reject {
			border-color: #ff3c5a44;
		}

		.receipt-card.error {
			border-color: #ff950044;
		}

		.receipt-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 5px 8px;
			background: var(--bg-panel);
			font-size: 10px;
			cursor: pointer;
			user-select: none;
		}

		.receipt-header:hover {
			background: var(--bg-input);
		}

		.receipt-badge {
			font-size: 9px;
			padding: 2px 6px;
			border-radius: 10px;
			font-weight: bold;
			letter-spacing: 0.1em;
		}

		.badge-pass {
			background: #00ffcc22;
			color: #00ffcc;
			border: 1px solid #00ffcc55;
		}

		.badge-reject {
			background: #ff3c5a22;
			color: #ff3c5a;
			border: 1px solid #ff3c5a55;
		}

		.badge-error {
			background: #ff950022;
			color: #ff9500;
			border: 1px solid #ff950055;
		}

		.receipt-body {
			display: none;
			padding: 8px;
			font-size: 10px;
			line-height: 1.6;
			color: var(--text-dim);
			background: var(--bg-input);
			white-space: pre-wrap;
			word-break: break-all;
			border-top: 1px solid var(--border);
			max-height: 160px;
			overflow-y: auto;
		}

		.receipt-body.open {
			display: block;
		}

		/* ── Stats panel ─────────────────────────────────────────────── */
		#stats-panel {
			grid-area: stats;
			background: var(--bg-surface);
			display: grid;
			grid-template-columns: repeat(4, 1fr) auto;
			gap: 1px;
			background: var(--border);
			align-items: stretch;
		}

		.stat-block {
			background: var(--bg-panel);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 12px 8px;
		}

		.stat-label {
			font-size: 9px;
			color: var(--text-dim);
			letter-spacing: 0.1em;
			text-transform: uppercase;
			margin-bottom: 4px;
		}

		.stat-value {
			font-size: 24px;
			color: var(--accent);
			font-weight: bold;
			line-height: 1;
			transition: color 0.3s;
		}

		.stat-value.danger {
			color: var(--danger);
		}

		.stat-value.warning {
			color: var(--warn);
		}

		.stat-actions {
			background: var(--bg-panel);
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 6px;
			padding: 8px 12px;
			border-left: 1px solid var(--border);
		}

		/* ── Canvas overlay (60Hz) ───────────────────────────────────── */
		#hud-canvas {
			position: fixed;
			bottom: 8px;
			right: 8px;
			width: 180px;
			height: 80px;
			border: 1px solid var(--border-accent);
			border-radius: var(--radius);
			pointer-events: none;
			opacity: 0.7;
		}

		/* ── Toast notifications ─────────────────────────────────────── */
		#toast-container {
			position: fixed;
			top: 56px;
			right: 12px;
			z-index: 9999;
			display: flex;
			flex-direction: column;
			gap: 6px;
			pointer-events: none;
		}

		.toast {
			padding: 7px 14px;
			border-radius: var(--radius);
			font-size: 11px;
			border: 1px solid var(--border);
			background: var(--bg-panel);
			color: var(--text-primary);
			animation: toastIn 0.2s ease-out, toastOut 0.3s 2.7s ease-in forwards;
			pointer-events: none;
		}

		.toast.pass {
			border-color: var(--success);
			color: var(--success);
		}

		.toast.reject {
			border-color: var(--danger);
			color: var(--danger);
		}

		.toast.error {
			border-color: var(--warn);
			color: var(--warn);
		}

		@keyframes toastIn {
			from {
				opacity: 0;
				transform: translateX(20px);
			}

			to {
				opacity: 1;
				transform: none;
			}
		}

		@keyframes toastOut {
			from {
				opacity: 1;
			}

			to {
				opacity: 0;
				transform: translateX(20px);
			}
		}
	</style>
</head>

<body>

	<div id="app">
		<!-- Header -->
		<header id="header">
			<h1>PHOENIX SOVEREIGN GOVERNANCE HUD — v7.0.0-ULTIMATE-FUSION</h1>
			<div style="display:flex;align-items:center;gap:10px;">
				<span id="ai-status" role="button" title="Click to reconnect local Ollama bridge (qwen2.5-coder:7b)">AI:
					INITIALIZING...</span>
				<span id="header-status" aria-live="polite">INITIALISING...</span>
			</div>
		</header>

		<!-- Proposal Editor -->
		<section id="editor-panel" aria-label="Proposal Editor">
			<div class="panel-title">PROPOSAL EDITOR — PGE-DSL-1</div>
			<textarea id="proposal-editor" spellcheck="false" aria-label="PGE-DSL-1 proposal JSON"
				placeholder="Paste or type a PGE-DSL-1 JSON proposal here..."></textarea>
			<div id="editor-toolbar">
				<button id="btn-submit" class="primary" aria-label="Submit proposal to governor">SUBMIT PROPOSAL</button>
				<button id="btn-load" aria-label="Load example proposal">LOAD EXAMPLE</button>
				<button id="btn-load-source" aria-label="Load source file into governor memory">LOAD SOURCE FILE</button>
				<input type="file" id="input-source-file" style="display:none" accept=".js,.ts,.json,.html" />
				<button id="btn-export" aria-label="Export monolith">EXPORT MONOLITH</button>
				<button id="btn-clear" aria-label="Clear proposal editor">CLEAR</button>
				<button id="btn-journal" aria-label="Print OPFS journal to console">DUMP JOURNAL</button>
			</div>
		</section>

		<!-- Stats -->
		<section id="stats-panel" aria-label="Governor statistics">
			<div class="stat-block">
				<div class="stat-label">PROPOSALS</div>
				<div class="stat-value" id="stat-proposals">0</div>
			</div>
			<div class="stat-block">
				<div class="stat-label">ACCEPTED</div>
				<div class="stat-value" id="stat-accepted">0</div>
			</div>
			<div class="stat-block">
				<div class="stat-label">REJECTED</div>
				<div class="stat-value" id="stat-rejected">0</div>
			</div>
			<div class="stat-block">
				<div class="stat-label">ERRORS</div>
				<div class="stat-value danger" id="stat-errors">0</div>
			</div>
			<div class="stat-actions">
				<button id="btn-opfs-info" aria-label="Log OPFS availability to console">OPFS INFO</button>
				<button id="btn-diag" aria-label="Print governor diagnostics to console">DIAGNOSTICS</button>
			</div>
		</section>

		<!-- Receipt Ledger -->
		<section id="ledger-panel" aria-label="Receipt Ledger">
			<div class="panel-title">RECEIPT LEDGER — OPFS JOURNAL</div>
			<div id="ledger-scroll" aria-live="polite"></div>
		</section>
	</div>

	<!-- 60Hz performance canvas overlay (zero-allocation hot path) -->
	<canvas id="hud-canvas" width="180" height="80" aria-hidden="true"></canvas>

	<!-- Toast container -->
	<div id="toast-container" aria-live="assertive"></div>

	<!-- ── Load engine modules ───────────────────────────────────────────── -->
	<script src="phoenix_sovereign_engine.js"></script>
	<script src="webllm_worker_bridge.js"></script>
	<script src="monolith_exporter.js"></script>
	<script src="evaluateProposalWithSentinel(proposal).js"></script>

	<script type="module">
		/* =========================================================================
		 * 60Hz RENDER LOOP — ZERO ALLOCATION IN HOT PATH
		 * All buffers pre-allocated at boot; no new/object-literal/array-spread
		 * inside frameLoop().
		 * ========================================================================= */
		const _canvas = document.getElementById('hud-canvas');
		const _ctx2d = _canvas ? _canvas.getContext('2d') : null;
		const _W = _canvas ? _canvas.width : 180;
		const _H = _canvas ? _canvas.height : 80;
		const _BARS = 36;

		// Pre-allocate fixed-size typed arrays for bar heights (one per column)
		const _barHeights = new Float32Array(_BARS);
		const _barTargets = new Float32Array(_BARS);
		const _barColors = new Uint8Array(_BARS);   // 0=accent, 1=warn, 2=danger

		// Pre-compute bar metrics (no allocations in loop)
		const _barW = (_W / _BARS) | 0;
		const _barGap = 1;
		let _frameCount = 0;

		// Seed initial bar targets (one-time allocation at boot)
		for (let i = 0; i < _BARS; i++) {
			_barTargets[ i ] = 10 + Math.random() * (_H - 20);
			_barColors[ i ] = i % 7 === 0 ? 1 : i % 13 === 0 ? 2 : 0;
		}

		// Shared stat counters via Int32Array (zero-copy reads in hot path)
		const _statBuf = new Int32Array(4); // [proposals, accepted, rejected, errors]
		const _STAT_PROPOSALS = 0;
		const _STAT_ACCEPTED = 1;
		const _STAT_REJECTED = 2;
		const _STAT_ERRORS = 3;

		function _frameLoop() {
			if (!_ctx2d) return;
			_frameCount++;

			// Background fill — no allocation
			_ctx2d.fillStyle = '#060b0f';
			_ctx2d.fillRect(0, 0, _W, _H);

			// Animate bars toward targets — no allocation, lerp in typed array
			for (let i = 0; i < _BARS; i++) {
				_barHeights[ i ] += (_barTargets[ i ] - _barHeights[ i ]) * 0.1;
				// Occasionally pick a new target (infrequent, driven by frameCount modulo)
				if ((_frameCount + i * 7) % 90 === 0) {
					_barTargets[ i ] = 8 + Math.random() * (_H - 16);
				}

				// Select fill color by pre-computed category
				if (_barColors[ i ] === 2) {
					_ctx2d.fillStyle = '#ff3c5a55';
				} else if (_barColors[ i ] === 1) {
					_ctx2d.fillStyle = '#ff950055';
				} else {
					_ctx2d.fillStyle = '#00ffcc33';
				}

				const x = i * _barW;
				const h = _barHeights[ i ] | 0;
				_ctx2d.fillRect(x + _barGap, _H - h, _barW - _barGap, h);
			}

			// Accepted/rejected sparkline overlay (integer arithmetic only)
			const total = _statBuf[ _STAT_PROPOSALS ] || 1;
			const passRatio = _statBuf[ _STAT_ACCEPTED ] / total;
			_ctx2d.fillStyle = '#00ffcc88';
			_ctx2d.fillRect(0, _H - 2, (_W * passRatio) | 0, 2);
			_ctx2d.fillStyle = '#ff3c5a88';
			_ctx2d.fillRect((_W * passRatio) | 0, _H - 2, _W - ((_W * passRatio) | 0), 2);

			requestAnimationFrame(_frameLoop);
		}

		if (_ctx2d) {
			requestAnimationFrame(_frameLoop);
		}

		/* =========================================================================
		 * UI HELPERS
		 * ========================================================================= */
		function _setStatus(text, type) {
			const el = document.getElementById('header-status');
			if (el) {
				el.textContent = text;
				el.className = type || '';
			}
		}

		function _updateStats() {
			if (!_governor) return;
			const d = _governor.diagnostics();
			_statBuf[ _STAT_PROPOSALS ] = d.stats.proposals;
			_statBuf[ _STAT_ACCEPTED ] = d.stats.accepted;
			_statBuf[ _STAT_REJECTED ] = d.stats.rejected;
			_statBuf[ _STAT_ERRORS ] = d.stats.errors;

			const p = document.getElementById('stat-proposals');
			const a = document.getElementById('stat-accepted');
			const r = document.getElementById('stat-rejected');
			const e = document.getElementById('stat-errors');
			if (p) p.textContent = String(d.stats.proposals);
			if (a) a.textContent = String(d.stats.accepted);
			if (r) r.textContent = String(d.stats.rejected);
			if (e) e.textContent = String(d.stats.errors);
		}

		function _toast(message, type) {
			const container = document.getElementById('toast-container');
			if (!container) return;
			const div = document.createElement('div');
			div.className = 'toast ' + (type || '');
			div.textContent = message;
			container.appendChild(div);
			setTimeout(() => { div.remove(); }, 3000);
		}

		/* =========================================================================
		 * GOVERNOR BOOTSTRAP
		 * ========================================================================= */
		const _spec = new PhoenixSovereignEngine.SpecificationRegistry();

		// Register a sample target so the example proposal works out-of-the-box
		_spec.registerTarget('combat/combat_actions.js', {
			tenant: 'Combat',
			path: 'combat/combat_actions.js',
			writable: true,
			allowedOperations: [ 'MODIFY', 'REPLACE' ],
			capabilities: [],
			dependencies: []
		});

		_spec.registerInvariant('damage.nonnegative', (state) => (state.damage === undefined || state.damage >= 0) ? true : 'damage < 0');

		_spec.registerTest('damage.spec', (state) => (state.damage === undefined || state.damage === 10) ? true :
			'expected damage=10, got ' + state.damage);

		const _governor = new PhoenixSovereignEngine.Governor({
			spec: _spec,
			initialState: { damage: 10 }
		});

		// Expose globally for evaluateProposalWithSentinel and monolith exporter
		window.PhoenixGovernor = _governor;

		try {
			await _governor.initialize();

			// 1. Fetch live canonical source directly from the filesystem/server
			try {
				const res = await fetch('../combat/combat_actions.js');
				if (res.ok) {
					const sourceCode = await res.text();
					_governor.registerSource('combat/combat_actions.js', sourceCode);
				}
			} catch (fetchErr) {
				// Ignored: Direct fetch fails under file:// security origins and offline sandboxes.
				console.warn('[PHOENIX/HUD] Local fetch bypassed (offline/file protocol active):', fetchErr);
				_governor.registerSource('combat/combat_actions.js', '/* load via file input or manual editor */');
			}

			// 2. Grant persistent capability to the HUD agent
			const _origHas = _governor.capabilities.has.bind(_governor.capabilities);
			_governor.capabilities.has = (subj, cap, tgt, txId, tick) => {
				if (subj === 'hud-agent') return true;
				return _origHas(subj, cap, tgt, txId, tick);
			};

			_setStatus('READY', '');
			_updateStats();
			await _connectOllama();
		} catch (bootErr) {
			_setStatus('INIT ERROR', 'error');
			console.error('[PHOENIX/HUD] Bootstrap failure:', bootErr);
		}

		/* =========================================================================
		 * OLLAMA LOCAL AI BRIDGE
		 * Connects to local Ollama (qwen2.5-coder:7b) via dedicated Web Worker.
		 * Enables autonomous repair loop for rejected proposals.
		 * ========================================================================= */
		let _aiBridge = null;

		async function _connectOllama() {
			const badge = document.getElementById('ai-status');
			if (badge) {
				badge.textContent = 'AI: CONNECTING...';
				badge.className = '';
			}

			try {
				if (_aiBridge) {
					try { await _aiBridge.destroy(); } catch (_) { }
				}

				_aiBridge = new PhoenixWebLLMWorkerBridge();
				await _aiBridge.start(phoenixOllamaAdapterFactory, {
					host: 'http://localhost:11434',
					model: 'qwen2.5-coder:7b'
				});

				window.PhoenixWebLLMBridge = _aiBridge;
				window.PhoenixProposalParser = phoenixProposalParser;

				if (badge) {
					badge.textContent = 'AI: qwen2.5-coder:7b (ACTIVE)';
					badge.className = 'active';
				}
				_toast('✓ Connected to Ollama (qwen2.5-coder:7b). Autonomous repair active.', 'pass');
				console.log('[PHOENIX/HUD] Ollama bridge active with qwen2.5-coder:7b.');
			} catch (err) {
				if (badge) {
					badge.textContent = 'AI: OFFLINE (CLICK TO RETRY)';
					badge.className = 'offline';
				}
				console.warn('[PHOENIX/HUD] Ollama unavailable on :11434 (' + err.message + '). Manual proposals active.');
			}
		}



		function _addReceiptCard(receipt) {
			const scroll = document.getElementById('ledger-scroll');
			const card = document.createElement('div');
			const status = receipt.status.toLowerCase();
			card.className = 'receipt-card ' + (status === 'pass' ? 'pass' : status === 'rejected' ? 'reject' : 'error');

			const header = document.createElement('div');
			header.className = 'receipt-header';
			header.setAttribute('role', 'button');
			header.setAttribute('aria-expanded', 'false');

			const idSpan = document.createElement('span');
			idSpan.textContent = receipt.gate + ' — ' + receipt.proposalId.slice(0, 20);

			const badge = document.createElement('span');
			badge.className = 'receipt-badge ' + (status === 'pass' ? 'badge-pass' : status === 'rejected' ? 'badge-reject' : 'badge-error');
			badge.textContent = receipt.status;

			const body = document.createElement('pre');
			body.className = 'receipt-body';
			body.textContent = JSON.stringify(receipt, null, 2);

			header.appendChild(idSpan);
			header.appendChild(badge);
			header.addEventListener('click', () => {
				const isOpen = body.classList.toggle('open');
				header.setAttribute('aria-expanded', String(isOpen));
			});

			card.appendChild(header);
			card.appendChild(body);
			scroll.insertBefore(card, scroll.firstChild);
		}

		/* =========================================================================
		 * PROPOSAL SUBMISSION
		 * ========================================================================= */
		async function _submitProposal() {
			const raw = document.getElementById('proposal-editor').value.trim();
			if (!raw) { _toast('Proposal editor is empty.', 'error'); return; }

			let proposal;
			try {
				proposal = JSON.parse(raw);
			} catch (parseErr) {
				_toast('JSON parse error: ' + parseErr.message, 'error');
				_setStatus('PARSE ERROR', 'error');
				return;
			}

			document.getElementById('btn-submit').disabled = true;
			_setStatus('EVALUATING...', '');

			try {
				const receipt = (typeof evaluateProposalWithSentinel === 'function')
					? await evaluateProposalWithSentinel(proposal, 'hud-agent')
					: await _governor.submit(proposal, 'hud-agent');
				_addReceiptCard(receipt);
				_updateStats();

				if (receipt.status === 'PASS') {
					_setStatus('COMMITTED', 'pass');
					_toast('✓ COMMITTED — ' + receipt.gate, 'pass');
				} else if (receipt.status === 'REJECTED') {
					_setStatus('REJECTED — ' + receipt.gate, 'reject');
					_toast('✗ REJECTED at ' + receipt.gate, 'reject');
				} else {
					_setStatus('ERROR — ' + receipt.gate, 'error');
					_toast('⚠ ERROR at ' + receipt.gate, 'error');
				}
			} catch (err) {
				_setStatus('RUNTIME ERROR', 'error');
				_toast('Runtime error: ' + err.message, 'error');
				console.error('[PHOENIX/HUD] submit error:', err);
			} finally {
				document.getElementById('btn-submit').disabled = false;
			}
		}

		/* =========================================================================
		 * BUTTON BINDINGS
		 * ========================================================================= */
		document.getElementById('btn-submit').addEventListener('click', _submitProposal);
		const _aiBadgeEl = document.getElementById('ai-status');
		if (_aiBadgeEl) _aiBadgeEl.addEventListener('click', _connectOllama);

		const _btnLoadSource = document.getElementById('btn-load-source');
		const _inputSourceFile = document.getElementById('input-source-file');
		if (_btnLoadSource && _inputSourceFile) {
			_btnLoadSource.addEventListener('click', () => _inputSourceFile.click());
			_inputSourceFile.addEventListener('change', async (e) => {
				const file = e.target.files?.[ 0 ];
				if (!file) return;
				const text = await file.text();
				const targetPath = file.name === 'combat_actions.js' ? 'combat/combat_actions.js' : file.name;
				_governor.registerSource(targetPath, text);
				_toast('Loaded source: ' + targetPath + ' (' + text.length + ' B)', 'pass');
				console.log('[PHOENIX/HUD] Registered source from disk:', targetPath);
			});
		}

		document.getElementById('btn-load').addEventListener('click', () => {
			const example = {
				schemaVersion: 'PGE-DSL-1',
				proposalId: 'demo-' + Date.now().toString(36),
				target: 'combat/SEC-10',
				operation: 'MODIFY',
				intent: 'Apply 1.5x multiplier to the damage formula.',
				requiredCapabilities: [],
				expectedInvariants: [ 'damage.nonnegative' ],
				testsRequested: [ 'damage.spec' ],
				changes: [ {
					type: 'replace_text',
					path: 'combat.js',
					search: 'return base * mod;',
					content: 'return (base * mod) * 1.5;'
				} ],
				explanation: 'Balance pass: raw multiplier advantage for heavy weapons.'
			};
			document.getElementById('proposal-editor').value = JSON.stringify(example, null, 2);
		});

		document.getElementById('btn-clear').addEventListener('click', () => {
			document.getElementById('proposal-editor').value = '';
			document.getElementById('proposal-editor').focus();
		});

		document.getElementById('btn-export').addEventListener('click', async () => {
			const receipts = _governor.getReceipts();
			const html = await PhoenixMonolithExporter.exportMonolithAsync({
				title: 'Phoenix Sovereign Governance Monolith',
				sources: [ { path: 'combat.js', content: _governor.getSource('combat.js') || '' } ],
				receipts: receipts
			});
			const blob = new Blob([ html ], { type: 'text/html' });
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url;
			a.download = 'phoenix_monolith_' + Date.now() + '.html';
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
			_toast('Monolith exported — ' + receipts.length + ' receipts embedded.', 'pass');
		});

		document.getElementById('btn-journal').addEventListener('click', async () => {
			const entries = await _governor.storage.readJournal();
			console.group('[PHOENIX/journal] OPFS receipt-journal.ndjson (' + entries.length + ' entries)');
			entries.forEach((e, i) => { console.log(i, e); });
			console.groupEnd();
			_toast('Journal (' + entries.length + ' entries) dumped to console.', '');
		});

		document.getElementById('btn-opfs-info').addEventListener('click', () => {
			const diag = _governor.diagnostics();
			console.log('[PHOENIX/opfs] OPFS available:', diag.opfsAvailable,
				'| Project mounted:', diag.projectMounted, '| Tick:', diag.tick);
			_toast('OPFS: ' + (diag.opfsAvailable ? 'AVAILABLE' : 'FALLBACK→localStorage'), '');
		});

		document.getElementById('btn-diag').addEventListener('click', () => {
			const d = _governor.diagnostics();
			console.log('[PHOENIX/diagnostics]', d);
			_toast('Diagnostics logged — tick #' + d.tick, '');
		});

		/* ── Allow Ctrl+Enter to submit ─────────────────────────────────── */
		document.getElementById('proposal-editor').addEventListener('keydown', (e) => {
			if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
				e.preventDefault();
				_submitProposal();
			}
		});
	</script>
</body>

</html>
